[package]
name = "starbound-modpack-launcher"
version = "0.85.0"
description = "Base10 starbound launcher"
authors = ["base10"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.57"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.7", features = [] }
reqwest = { version = "0.13.5", features = ["stream", "json"] }
tokio = { version = "1", features = ["time"] }
futures-util = "0.3.34"
sha2 = "0.11.1"
bytesize = "2.7.0"
tauri-plugin-shell = "2.6.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-notification = "2.8.1"
tauri-plugin-fs = "2.7.1"
tauri-plugin-os = "2.4.0"
tauri-plugin-http = "2.9.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-process = "2.4.0"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = false

[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-updater = "2.14.1"
